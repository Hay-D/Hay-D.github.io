<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.wikia.nocookie.net; worker-src 'self' blob:; connect-src 'self' https://raw.githubusercontent.com https://static.wikia.nocookie.net https://gateway.umami.is; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141416"><meta name="color-scheme" content="dark">
<meta name="description" content="Build, price, scan, and share your Hay Day trades.">
<title>HayDex</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="workspace.css">

<script type="module" src="js/analytics.js"></script>
</head>
<body class="trade-page">
<a class="skip-link" href="#main">Skip to trade</a>
<header class="app-header"><a class="brand" href="./" aria-label="HayDex home"><img src="assets/haydaylogo.svg" width="32" height="32" alt=""><span>HayDex</span></a><div class="header-actions"><button class="header-button" id="open-saved" aria-label="Saved lists" title="Saved lists"><svg aria-hidden="true"><use href="assets/icons.svg#bookmark"></use></svg></button><button class="level-badge" id="open-farm" title="Farm settings"><svg aria-hidden="true"><use href="assets/icons.svg#star"></use></svg><span id="header-level">Level</span></button></div></header>
<main class="app-main" id="main">
<h1 class="sr-only">Trade editor</h1>
<div class="editor-strip"><button class="list-title" id="list-name-button" title="Rename or save list"><span id="current-list-name">My trade</span><svg aria-hidden="true"><use href="assets/icons.svg#chevron-right"></use></svg><span class="count-badge" id="board-count">0</span></button><div class="segmented trade-mode" role="group" aria-label="Trade type"><button data-mode="sell" class="active">Sell</button><button data-mode="buy">Buy</button></div><div class="strip-tools"><button class="icon-button" id="undo-button" aria-label="Undo" title="Undo" disabled><svg aria-hidden="true"><use href="assets/icons.svg#undo"></use></svg></button><button class="icon-button" id="redo-button" aria-label="Redo" title="Redo" disabled><svg aria-hidden="true"><use href="assets/icons.svg#redo"></use></svg></button><label class="partial-toggle" title="Accept partial trades"><input id="summary-partials" type="checkbox" checked><span>Partials</span></label><button class="strip-button" id="select-mode" aria-pressed="false"><svg aria-hidden="true"><use href="assets/icons.svg#select"></use></svg>Select</button><button class="icon-button" id="open-layout" aria-label="Image appearance" title="Image appearance"><svg aria-hidden="true"><use href="assets/icons.svg#grid"></use></svg></button></div></div>
<div class="selection-tools" id="selection-tools" hidden><span id="selection-count">0 selected</span><button id="select-all">All</button><button id="bulk-price">Price</button><button id="bulk-quantity">Quantity</button><button class="danger-text" id="delete-selected" aria-label="Delete selected items" title="Delete selected"><svg aria-hidden="true"><use href="assets/icons.svg#trash"></use></svg></button><button id="save-selected" aria-label="Save selected prices to this trade" title="Save selected prices to this trade" disabled>Save</button><button id="clear-selection">Done</button></div>
<section class="image-region" id="image-region" aria-label="Editable trade image" hidden><button class="image-contact" id="image-contact" hidden></button><input class="image-caption" id="caption-top" aria-label="Edit top caption" maxlength="160" hidden><div class="generated-grid" id="trade-grid"></div><input class="image-caption" id="caption-bottom" aria-label="Edit bottom caption" maxlength="160" hidden><div class="image-footer" id="image-footer"><button class="image-totals" id="image-totals" title="Choose payment item" aria-label="Choose payment item"></button><span class="image-watermark" id="image-watermark"></span></div><button class="image-notes" id="image-notes" hidden></button></section>
<section class="stage-empty" id="stage-empty" aria-label="Empty trade"><button class="button primary" id="empty-add"><svg aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>Add items</button><p class="inline-error" id="load-error" role="alert" hidden></p></section>
<p class="trade-notice" id="trade-notice" role="status" hidden></p>
<div class="editor-foot"><button class="text-button" id="sort-menu" title="Sort items"><svg aria-hidden="true"><use href="assets/icons.svg#sort"></use></svg><span id="sort-label">Quantity</span></button><span id="save-status" role="status">Saved</span><button class="text-button" id="open-import"><svg aria-hidden="true"><use href="assets/icons.svg#import"></use></svg>Import</button><button class="icon-button" id="open-guide" aria-label="Help" title="Help"><svg aria-hidden="true"><use href="assets/icons.svg#help"></use></svg></button></div>
</main>
<main class="app-main scanner-view" id="scanner-view" hidden><iframe id="scanner-frame" title="Barn scanner" allow="clipboard-write"></iframe></main>
<nav class="action-bar" aria-label="Trade tools"><button class="action-primary" id="open-add" aria-label="Add items" title="Add items"><svg aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg><span>Add items</span></button><a href="scanner/" id="open-scanner" aria-label="Scanner" title="Scanner"><svg aria-hidden="true"><use href="assets/icons.svg#scan"></use></svg><span>Scanner</span></a><button id="open-prices" aria-label="Prices" title="Prices"><svg aria-hidden="true"><use href="assets/icons.svg#tag"></use></svg><span>Prices</span></button><button id="copy-text" aria-label="Share text" title="Share text"><svg aria-hidden="true"><use href="assets/icons.svg#copy"></use></svg><span>Text</span></button><button id="preview-card" aria-label="Share image" title="Share image"><svg aria-hidden="true"><use href="assets/icons.svg#image"></use></svg><span>Image</span></button><button id="open-settings" aria-label="Settings" title="Settings"><svg aria-hidden="true"><use href="assets/icons.svg#sliders"></use></svg><span>Settings</span></button></nav>
<div class="delete-zone" id="delete-zone" hidden><svg aria-hidden="true"><use href="assets/icons.svg#trash"></use></svg>Drop to delete</div>
<dialog class="dialog" id="modal" aria-labelledby="modal-title"><div class="modal-heading"><button class="icon-button" id="modal-back" aria-label="Back to settings" hidden><svg aria-hidden="true"><use href="assets/icons.svg#arrow-left"></use></svg></button><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="Close"><svg aria-hidden="true"><use href="assets/icons.svg#close"></use></svg></button></div><div class="modal-content" id="modal-content"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-message"></span><button id="toast-undo" hidden>Undo</button></div>
<noscript><div class="noscript-note">Enable JavaScript to edit trades.</div></noscript>
<script type="module" src="js/trade.js"></script>
</body></html>
