<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.wikia.nocookie.net; worker-src 'self' blob:; connect-src 'self' https://raw.githubusercontent.com https://static.wikia.nocookie.net https://gateway.umami.is; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141416"><meta name="description" content="Read your Hay Day barn photos on this device and turn the stock into a trade."><meta name="color-scheme" content="dark"><title>Scanner · HayDex</title><script src="embed.js"></script><link rel="icon" href="../assets/favicon.svg"><link rel="preload" href="../assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="scanner.css"><link rel="stylesheet" href="review.css"><link rel="stylesheet" href="../workspace.css"><script type="module" src="../js/analytics.js"></script>
</head>
<body class="scanner-page"><a class="skip-link" href="#main">Skip to scanner</a>
<header class="app-header"><a class="brand" href="../" aria-label="HayDex home"><img src="../assets/haydaylogo.svg" width="32" height="32" alt=""><span>HayDex</span></a><div class="header-actions"><button class="header-button" id="open-saved" aria-label="Saved lists" title="Saved lists"><svg aria-hidden="true"><use href="../assets/icons.svg#bookmark"></use></svg></button><button class="level-badge" id="open-farm" title="Farm settings"><svg aria-hidden="true"><use href="../assets/icons.svg#star"></use></svg><span id="header-level">Level</span></button></div></header>
<main class="app-main" id="main"><div class="page-title"><h1>Scanner</h1><button class="model-badge" id="model-settings" title="Scanner model settings"><span class="status-dot" id="model-dot"></span><span id="model-status">Starting…</span></button></div>
<div class="scanner-topline"><div class="scan-steps segmented" role="group" aria-label="Scanner view"><button class="active" id="photos-step">Photos <span id="image-count">0</span></button><button id="review-step" disabled>Review <span id="review-count">0</span></button></div>
<div class="scanner-preferences"><button class="button secondary" id="open-exclusions">Excluded items <span id="excluded-count">0</span></button></div></div>
<section class="model-setup" id="model-setup"><div class="setup-icon"><svg aria-hidden="true"><use href="../assets/icons.svg#scan"></use></svg></div><div class="setup-copy"><h2>Scanner model</h2><p id="model-size">One download, kept here. Photos never leave your phone.</p></div><button class="button primary" id="fetch-model">Download model</button><div class="model-progress" id="model-progress" hidden><progress id="model-progress-bar" max="100" value="0"></progress><span id="model-progress-text" role="status">Preparing…</span><button class="text-button" id="cancel-model">Cancel</button></div><p class="inline-error" id="model-error" role="alert" hidden></p></section>
<section class="photos-panel" id="photos-panel"><label class="drop-zone" id="drop-zone"><input type="file" id="screenshots" accept="image/png,image/jpeg,image/webp" multiple><svg aria-hidden="true"><use href="../assets/icons.svg#upload"></use></svg><strong id="upload-label">Add photos</strong><span>PNG · JPG · WebP</span></label><button id="add-photos" hidden>Add photos</button><div class="upload-list" id="upload-list"></div>
<details class="calibration" id="calibration" hidden><summary>Crop & alignment</summary><div class="calibration-heading"><select id="calibration-image" aria-label="Photo to align"></select><button class="text-button" id="detect-layout">Reset</button></div><div class="layout-row"><label for="layout-preset">Layout</label><select id="layout-preset"><option value="auto">Auto</option><option value="manual" disabled>Custom grid</option><option value="storage">Barn / silo</option><option value="shop">Roadside shop</option></select><span id="layout-status"></span></div><canvas id="image-preview" aria-label="Photo with detected item grid"></canvas><details class="advanced"><summary>Adjust grid</summary><div class="calibration-fields"><label>Left %<input id="crop-x" type="number" min="0" max="95" step=".1"></label><label>Top %<input id="crop-y" type="number" min="0" max="95" step=".1"></label><label>Width %<input id="crop-w" type="number" min="5" max="100" step=".1"></label><label>Height %<input id="crop-h" type="number" min="5" max="100" step=".1"></label><label>Columns<input id="grid-cols" type="number" min="1" max="8"></label><label>Rows<input id="grid-rows" type="number" min="1" max="12"></label></div><label class="toggle-label"><input type="checkbox" id="skip-edge">Skip edge rows</label><button class="text-button" id="apply-layout">Apply grid to all photos</button></details></details>
<div class="scan-action"><span id="scan-hint">Photos stay on your device</span><button class="button primary" id="scan-button" disabled><svg aria-hidden="true"><use href="../assets/icons.svg#scan"></use></svg><span id="scan-button-label">Scan photos</span></button></div><div class="scan-progress" id="scan-progress" hidden><progress id="progress" max="100" value="0"></progress><span id="progress-text" role="status">Preparing…</span><button class="text-button" id="cancel-scan">Stop</button></div></section>
<section class="results-panel" id="results-panel" hidden><div class="review-heading"><div><h2>Review</h2><p id="review-banner">Tick the rows you checked. Fix names and numbers first.</p></div><button class="icon-button" id="add-manual" aria-label="Add a result manually"><svg aria-hidden="true"><use href="../assets/icons.svg#plus"></use></svg></button></div><div class="review-toolbar"><select id="review-filter" aria-label="Review filter"><option value="all">All items</option><option value="pending">To check</option><option value="confirmed">Ready</option></select><button class="text-button" id="confirm-all">Confirm valid</button></div><div class="review-columns" id="review-columns" aria-hidden="true"><span class="column-item">Item</span><span class="column-qty">Qty</span><span class="column-price"><img src="../assets/services/coin.png" alt="">Each</span></div><div class="review-list" id="results-body"></div><div class="result-actions"><span id="export-count">0 ready</span><button class="button secondary" id="copy-code" disabled>Copy list</button><button class="button primary" id="send-trade" disabled>Create trade <svg aria-hidden="true"><use href="../assets/icons.svg#arrow-right"></use></svg></button></div><details class="advanced code-details"><summary>Item code & corrections</summary><textarea class="export-text" id="output-code" readonly aria-label="Item code"></textarea><div class="dialog-actions"><button class="button quiet" id="download-code">Download list</button><button class="button quiet" id="export-training">Export checked crops</button></div></details></section>
</main>
<nav class="action-bar" aria-label="Trade tools"><button class="action-primary" id="scanner-home" aria-label="Back to trade" title="Back to trade"><svg aria-hidden="true"><use href="../assets/icons.svg#home"></use></svg><span>Home</span></button><button class="active" id="scanner-tab" aria-label="Scanner" title="Scanner" aria-current="page"><svg aria-hidden="true"><use href="../assets/icons.svg#scan"></use></svg><span>Scanner</span></button><button id="open-prices" aria-label="Prices" title="Prices"><svg aria-hidden="true"><use href="../assets/icons.svg#tag"></use></svg><span>Prices</span></button><button id="copy-text" aria-label="Copy list" title="Copy list"><svg aria-hidden="true"><use href="../assets/icons.svg#copy"></use></svg><span>Text</span></button><button id="preview-card" aria-label="Share image" title="Share image"><svg aria-hidden="true"><use href="../assets/icons.svg#image"></use></svg><span>Image</span></button><button id="open-settings" aria-label="Scanner settings" title="Scanner settings"><svg aria-hidden="true"><use href="../assets/icons.svg#sliders"></use></svg><span>Settings</span></button></nav>
<dialog class="dialog" id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="Close"><svg aria-hidden="true"><use href="../assets/icons.svg#close"></use></svg></button></div><div class="modal-content" id="modal-content"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-message"></span></div>
<script type="module" src="scanner.js"></script></body></html>
